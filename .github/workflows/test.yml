name: Tests

# Offline monorepo verification: typecheck + every workspace's node:test
# suite.
#
# Runs as a blocking check on PRs (fork PRs included — the suite needs no
# secrets and no network), and is reused by publish.yml so a push to main
# must pass before anything reaches npm. Manual trigger kept for ad-hoc runs
# (e.g. before releasing platform-sensitive changes such as pi-access-denied's
# Git Bash / MSYS path handling).
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the version used by publish.yml

      # tsc resolves workspace devDependencies (pi-ai, pi-tui types, …).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # let every OS finish so all failures surface at once

      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches the version used by publish.yml

      # Several suites import real dependencies (unbash, @earendil-works/*
      # framework packages), so node_modules must be installed.
      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: npm test --workspaces --if-present

      - name: Test release bookkeeping in isolated Git repositories
        run: node --test .github/scripts/release-records.integration.test.mjs
